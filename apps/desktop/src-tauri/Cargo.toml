[package]
name = "ragsystem-desktop"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
description = "Local RAGSystem desktop broker"

[lib]
name = "ragsystem_desktop"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "=2.7.4", features = [] }

[dependencies]
tauri = { version = "=2.12.4", features = [] }
tauri-plugin-single-instance = "=2.5.4"
tauri-plugin-dialog = "=2.8.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "=0.13.5", default-features = false, features = ["blocking", "json"] }
getrandom = "=0.4.3"
sha2 = "=0.10.9"

[profile.release]
panic = "abort"
strip = true
