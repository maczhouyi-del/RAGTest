name: Source validation (not release acceptance)
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: source-check-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  source:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4 verified public ref
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22.22.1'
      - name: Locked dependencies (fresh CI workspace only)
        run: |
          python -m pip install uv==0.11.16
          uv sync --frozen --extra vector-lab --project engine
          npm --prefix apps/desktop install --ignore-scripts --no-audit --no-fund
          git diff --exit-code -- engine/uv.lock apps/desktop/package-lock.json apps/desktop/src-tauri/Cargo.lock
      - name: Public fixtures only, pinned SHA; no user corpus
        run: uv run --frozen --extra vector-lab --project engine python tools/fetch_public_fixtures.py --fetch
      - name: Python source, static checks and tests
        run: |
          uv run --frozen --extra vector-lab --project engine ruff check --config engine/pyproject.toml engine/ragsystem tests
          uv run --frozen --extra vector-lab --project engine pytest -c engine/pyproject.toml -q
      - name: TypeScript source build
        run: npm --prefix apps/desktop run build
      - name: Model-free test sidecar (not an installer)
        run: uv run --frozen --extra vector-lab --project engine python packaging/build_sidecar.py
      - name: Rust tests with current source sidecar
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then
            export RAGSYSTEM_TEST_SIDECAR="$GITHUB_WORKSPACE/apps/desktop/src-tauri/binaries/ragsystem-engine-x86_64-pc-windows-msvc.exe"
          else
            export RAGSYSTEM_TEST_SIDECAR="$GITHUB_WORKSPACE/apps/desktop/src-tauri/binaries/ragsystem-engine-aarch64-apple-darwin"
          fi
          cargo test --locked --manifest-path apps/desktop/src-tauri/Cargo.toml -- --test-threads=1
          cargo clippy --locked --manifest-path apps/desktop/src-tauri/Cargo.toml --all-targets -- -D warnings
      - name: npm vulnerability gate
        run: npm --prefix apps/desktop audit --package-lock-only --audit-level=moderate --registry=https://registry.npmjs.org
      - name: Gate boundary
        run: echo 'Model-specific skips are NOT EXECUTED. CI is not a clean-user install, signing, scientific gold or release approval.'
  lock-audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Lock SBOM and OSV public coordinates only (fail closed)
        run: python tools/dependency_gate.py --output .tools/ci-dependency-evidence --online
# No credentials, real model API, app installer, artifact/log upload, push or release steps.
