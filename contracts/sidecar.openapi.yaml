openapi: 3.1.0
info:
  title: RAGSystem 2.0 Internal Sidecar API (P0 PROPOSAL)
  version: 0.1.0-draft
  description: >-
    内部候选契约。仅供 Rust-mediated IPC/随机回环+短会话令牌设计验证；
    P0 若选择命名管道，可以保留请求语义而替换传输。此文件不是生产服务/API 实现。
servers:
  - url: http://127.0.0.1:{port}
    description: Placeholder only. Actual port MUST be random, loopback-only and authenticated.
    variables:
      port:
        default: '8765'
        description: Illustrative placeholder; never assume fixed 8765 in implementation.
security:
  - SessionToken: []
paths:
  /v0/health:
    get:
      operationId: getHealth
      summary: Sidecar 健康和功能可用状态（亦需授权）
      responses:
        '200':
          description: Authenticated runtime status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /v0/imports:
    post:
      operationId: queueImport
      summary: 用经 Rust 授权的 FileGrant 提交 PDF 导入，不接受任意本地路径
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [file_grant_id, idempotency_key]
              properties:
                file_grant_id:
                  type: string
                  minLength: 1
                  description: Opaque grant created and validated by Rust permission broker.
                idempotency_key:
                  type: string
                  minLength: 1
                project_id:
                  type: [string, 'null']
      responses:
        '202':
          description: Durable Job reference
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JobRef'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /v0/jobs/{jobId}:
    get:
      operationId: getJob
      summary: 查询持久任务（Job 形状见 job.schema.json）
      parameters:
        - $ref: '#/components/parameters/JobId'
      responses:
        '200':
          description: Durable Job snapshot
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JobStatus'
        '404':
          $ref: '#/components/responses/NotFound'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /v0/jobs/{jobId}/cancel:
    post:
      operationId: cancelJob
      summary: 申请取消未完成任务（不是保证撤销已发生的云调用）
      parameters:
        - $ref: '#/components/parameters/JobId'
      responses:
        '202':
          description: Cancellation requested
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JobRef'
        '404':
          $ref: '#/components/responses/NotFound'
  /v0/search:
    post:
      operationId: searchSources
      summary: P0 关键词或精确向量源检索（非 P3 科研问答）
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [query, strategy, authorized_doc_version_ids, k]
              properties:
                query:
                  type: string
                  minLength: 1
                  maxLength: 20000
                strategy:
                  enum: [fts_only, vector_exact]
                authorized_doc_version_ids:
                  type: array
                  minItems: 1
                  uniqueItems: true
                  items: {type: string, minLength: 1}
                  description: >-
                    Request-local whitelist. Server must recheck authorization against SQLite;
                    exact KNN must be computed WITHIN eligible candidates, not post-filtered full-corpus topK.
                k:
                  type: integer
                  minimum: 1
                  maximum: 100
                space_id:
                  type: [string, 'null']
                  description: Required in application validation when strategy=vector_exact.
      responses:
        '200':
          description: Anchored search results. No generated scientific claims.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [results, total_authorized_versions, strategy]
                properties:
                  strategy: {enum: [fts_only, vector_exact]}
                  total_authorized_versions: {type: integer, minimum: 0}
                  results:
                    type: array
                    items:
                      $ref: '#/components/schemas/SearchHit'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /v0/source-anchors/{sourceAnchorId}:
    get:
      operationId: getSourceAnchor
      summary: 检索来源锚点；实际 PDF 文件由 Rust broker 授权打开
      parameters:
        - name: sourceAnchorId
          in: path
          required: true
          schema: {type: string, minLength: 1}
      responses:
        '200':
          description: SourceAnchor snapshot; full structure in source-anchor.schema.json
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SourceAnchorResponse'
        '404':
          $ref: '#/components/responses/NotFound'
  /v0/diagnostics/index:
    get:
      operationId: getIndexDiagnostics
      summary: 报告索引实际数量与可见/失败/待处理，而非假称全部成功
      responses:
        '200':
          description: Persisted indexing counters
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [documents_total, documents_ready, documents_partial, documents_failed, chunks_visible, embeddings_persisted]
                properties:
                  documents_total: {type: integer, minimum: 0}
                  documents_ready: {type: integer, minimum: 0}
                  documents_partial: {type: integer, minimum: 0}
                  documents_failed: {type: integer, minimum: 0}
                  chunks_visible: {type: integer, minimum: 0}
                  embeddings_persisted: {type: integer, minimum: 0}
                  index_integrity_status: {enum: [ok, degraded, failed, not_checked]}
  /v0/backups:
    post:
      operationId: queueBackup
      summary: 提交备份任务；存储目标由 Rust grant 映射，不接受任意路径
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [destination_grant_id, idempotency_key]
              properties:
                destination_grant_id: {type: string, minLength: 1}
                idempotency_key: {type: string, minLength: 1}
                include_persisted_embeddings: {type: boolean, default: true}
      responses:
        '202':
          description: Backup Job
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JobRef'
components:
  securitySchemes:
    SessionToken:
      type: apiKey
      in: header
      name: X-RAG-Session
      description: >-
        Ephemeral secret established by Rust in protected Sidecar startup context;
        not exposed to arbitrary webview scripts, CLI argv, logs or remote interfaces.
  parameters:
    JobId:
      name: jobId
      in: path
      required: true
      schema: {type: string, minLength: 1}
  schemas:
    HealthResponse:
      type: object
      additionalProperties: false
      required: [status, sidecar_version, schema_version]
      properties:
        status: {enum: [starting, ready, degraded]}
        sidecar_version: {type: string}
        schema_version: {type: string}
        capabilities:
          type: array
          items: {type: string}
        disabled_reasons:
          type: array
          items: {type: string}
    JobRef:
      type: object
      additionalProperties: false
      required: [job_id, status]
      properties:
        job_id: {type: string, minLength: 1}
        status: {enum: [queued, running, completed, failed, retry_wait, cancelling, cancelled]}
    JobStatus:
      type: object
      additionalProperties: false
      required: [job_id, type, status, attempt_count, max_attempts]
      properties:
        job_id: {type: string}
        type: {enum: [import, parse_page, embed_batch, index_upsert, verify, research_extract, backup]}
        status: {enum: [queued, running, completed, failed, retry_wait, cancelling, cancelled]}
        attempt_count: {type: integer, minimum: 0}
        max_attempts: {type: integer, minimum: 1}
        error_code: {type: [string, 'null']}
        result_ref: {type: [string, 'null']}
        updated_at: {type: string, format: date-time}
    SearchHit:
      type: object
      additionalProperties: false
      required: [doc_version_id, chunk_id, source_anchor_id, page_number, preview, rank]
      properties:
        doc_version_id: {type: string}
        chunk_id: {type: string}
        source_anchor_id: {type: string}
        page_number: {type: integer, minimum: 1}
        preview: {type: string}
        rank: {type: integer, minimum: 1}
        distance: {type: [number, 'null']}
        location_confidence: {enum: [high, medium, low, unknown]}
    SourceAnchorResponse:
      type: object
      description: Shape must ultimately validate against source-anchor.schema.json.
      required: [source_anchor_id, doc_version_id, file_sha256, page_number, location_level, alignment_confidence]
      properties:
        source_anchor_id: {type: string}
        doc_version_id: {type: string}
        file_sha256: {type: string}
        page_number: {type: integer, minimum: 1}
        location_level: {enum: [region, table_cell, page_only, unresolved]}
        alignment_confidence: {enum: [high, medium, low, unknown]}
        bbox_norm:
          type: [object, 'null']
          description: See source-anchor.schema.json; unavailable or unverified -> null.
    ApiError:
      type: object
      additionalProperties: false
      required: [code, message, retriable]
      properties:
        code: {type: string, minLength: 1}
        message: {type: string}
        retriable: {type: boolean}
        correlation_id: {type: [string, 'null']}
  responses:
    Unauthorized:
      description: Missing, invalid or expired session
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ApiError'}
    BadRequest:
      description: Invalid request or insufficient local authorization
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ApiError'}
    NotFound:
      description: Resource missing, deleted, unavailable or not visible within authorization scope
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ApiError'}
