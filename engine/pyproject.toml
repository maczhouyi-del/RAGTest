[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ragsystem-engine"
version = "0.1.0"
description = "Local evidence workbench engine — P0 implementation"
requires-python = ">=3.12,<3.13"
dependencies = ["fastapi==0.162.0", "uvicorn==0.54.0", "pypdfium2==5.14.0"]

[project.optional-dependencies]
vector-lab = ["sqlite-vec==0.1.9", "lancedb==0.40.0"]
inference-lab = ["onnxruntime==1.31.0", "tokenizers==0.23.3"]
generation-lab = ["llama-cpp-python==0.3.36"]
ocr-lab = ["tesserocr==2.12.0"]
docling-lab = ["docling-slim[convert-core,format-pdf-pypdfium2,models-local]==2.142.1", "docling-ibm-models[opencv-python-headless]==4.0.4"]

[dependency-groups]
dev = ["pytest==9.1.1", "httpx==0.28.1", "ruff==0.17.2", "jsonschema==4.26.0", "PyYAML==6.0.3", "pyinstaller==6.22.3"]

[tool.setuptools.packages.find]
include = ["ragsystem*"]

[tool.uv]
environments = ["sys_platform == 'darwin' and platform_machine == 'arm64'", "sys_platform == 'win32' and platform_machine == 'AMD64'"]

[[tool.uv.index]]
name = "public-mirror"
url = "https://pypi.tuna.tsinghua.edu.cn/simple"
default = true

[[tool.uv.index]]
name = "ocr-pypi"
url = "https://pypi.org/simple"
explicit = true

[tool.uv.sources]
tesserocr = {index = "ocr-pypi"}
docling-slim = {index = "ocr-pypi"}
docling-ibm-models = {index = "ocr-pypi"}
docling-core = {index = "ocr-pypi"}

[tool.setuptools.package-data]
ragsystem = ["storage/migrations/*.sql"]

[tool.pytest.ini_options]
testpaths = ["../tests/unit", "../tests/integration"]
pythonpath = ["."]
addopts = "-ra"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
